[project]
name = "editor"
version = "0.1.0"
description = "Brand-locked short-form video editor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "faster-whisper>=1.1",
    "auto-editor>=26.0",
    "scenedetect>=0.6",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.1.1",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
ignore_missing_imports = true
exclude = ["storage/", "web/"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "pipeline", "llm"]
